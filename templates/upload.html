<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Upload Image - Emotion Recognition</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f2f4f8;
        }

        .header {
            background: #172554;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 6px;
        }

        .header p {
            font-size: 15px;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
            text-align: center;
        }

        h2 {
            color: #172554;
            margin-bottom: 20px;
        }

        .upload-box {
            border: 2px dashed #172554;
            padding: 35px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin: 15px;
            font-size: 15px;
        }

        button {
            background: #172554;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #243b75;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #172554;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>
            Human Emotion Recognition
        </h1>

        <p>
            CNN Based Emotion Detection System
        </p>

    </div>


    <div class="container">

        <div class="card">

            <h2>
                🖼️ Upload Image for Emotion Detection
            </h2>


            <form
                action="/predict_image"
                method="POST"
                enctype="multipart/form-data"
            >

                <div class="upload-box">

                    <p>
                        Select a face image from your computer
                    </p>

                    <input
                        type="file"
                        name="image"
                        accept="image/*"
                        required
                    >

                </div>


                <button type="submit">
                    🔍 Detect Emotion
                </button>

            </form>


            <a
                href="/"
                class="back"
            >
                ← Back to Dashboard
            </a>

        </div>

    </div>


</body>

</html>
